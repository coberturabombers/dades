name: Actualitza dades TRI

# Captura la PREVISIO DEL MATI del document mestre.
# La previsio esta disponible a partir de ~9:01 i NO es modifica fins a les 15:00.
# Fem la foto ben d'hora al mati, amb marge de sobres abans de les 15:00,
# perque encara que GitHub es retardi 1-2h (cosa normal), no arribi mai a les 15:00.
# Diversos intents: si un falla, els altres ho cobreixen. Funciona sol setmanes.

on:
  schedule:
    - cron: "15 7 * * *"    # ~09:15 estiu / 08:15 hivern
    - cron: "0 8 * * *"     # ~10:00 estiu / 09:00 hivern (reintent)
    - cron: "0 9 * * *"     # ~11:00 estiu / 10:00 hivern (ultim reintent; marge fins les 15:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualitza:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal.la dependencies
        run: pip install openpyxl

      - name: Descarrega i processa la copia del Drive
        env:
          ENLLAC_TRI: ${{ secrets.ENLLAC_TRI }}
        run: |
          python scripts/parse_tri.py --url "$ENLLAC_TRI"

      - name: Fes commit dels canvis
        run: |
          git config user.name "TRI Bot"
          git config user.email "actions@github.com"
          git add data/history.json data/latest.json
          if git diff --staged --quiet; then
            echo "Cap canvi de dades (el document encara no te la previsio nova o ja s'havia desat avui)."
          else
            git commit -m "Dades TRI del dia $(date +%F)"
            git push
          fi
